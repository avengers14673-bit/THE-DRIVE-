<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE DRIVE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* MAIN */
.drive{
    width:100%;
    max-width:500px;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at center, #1b1b1b 0%, #080808 45%, #000 100%);
}

/* TOP TITLE */
.logo{
    position:absolute;
    top:35px;
    left:0;
    width:100%;
    text-align:center;
    font-size:30px;
    font-weight:900;
    letter-spacing:8px;
    z-index:10;
}

.subtitle{
    position:absolute;
    top:72px;
    width:100%;
    text-align:center;
    font-size:9px;
    letter-spacing:5px;
    color:#777;
    z-index:10;
}

/* CAR */
.car-area{
    position:absolute;
    top:115px;
    left:0;
    width:100%;
    height:330px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:3;
}

.car{
    width:92%;
    max-width:450px;
    height:auto;
    object-fit:contain;
    display:block;
    user-select:none;
    pointer-events:none;

    filter:
        drop-shadow(0 15px 25px rgba(0,0,0,.9));

    transition:transform .08s linear;
}

/* SPEED LINES */
.speed-line{
    position:absolute;
    width:100%;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
    );

    opacity:0;
    z-index:1;
}

.line1{top:40px;}
.line2{top:100px;}
.line3{top:180px;}
.line4{top:250px;}

.driving .speed-line{
    opacity:.7;
    animation:speed 0.35s linear infinite;
}

@keyframes speed{
    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }
}

/* DASHBOARD */
.dashboard{
    position:absolute;
    bottom:120px;
    left:0;
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:5;
}

/* RPM ROUND */
.rpm{
    width:170px;
    height:170px;
    border-radius:50%;
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        conic-gradient(
            #fff 0deg,
            #fff var(--rpm),
            #242424 var(--rpm),
            #242424 360deg
        );

    box-shadow:
        0 0 0 8px #101010,
        0 0 30px rgba(255,255,255,.08);
}

.rpm::before{
    content:"";
    position:absolute;

    width:140px;
    height:140px;

    border-radius:50%;
    background:#070707;
}

/* RPM CONTENT */
.rpm-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.rpm-number{
    font-size:38px;
    font-weight:900;
    letter-spacing:2px;
}

.rpm-text{
    font-size:9px;
    letter-spacing:3px;
    color:#777;
    margin-top:3px;
}

/* RED ZONE */
.red-zone{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:conic-gradient(
        transparent 0deg,
        transparent 285deg,
        rgba(255,255,255,.8) 285deg,
        rgba(255,255,255,.8) 325deg,
        transparent 325deg
    );

    opacity:.35;
}

/* ACCELERATOR */
.controls{
    position:absolute;
    bottom:30px;
    left:0;
    width:100%;

    display:flex;
    justify-content:center;

    z-index:10;
}

.accelerator{
    width:260px;
    height:65px;

    border:1px solid #444;
    border-radius:35px;

    background:#111;
    color:white;

    font-size:15px;
    font-weight:bold;
    letter-spacing:5px;

    cursor:pointer;
    outline:none;

    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;

    box-shadow:
        0 8px 25px rgba(0,0,0,.8),
        inset 0 1px 0 rgba(255,255,255,.08);

    transition:.15s;
}

.accelerator:active,
.accelerator.active{
    transform:scale(.96);

    background:#1c1c1c;

    box-shadow:
        0 0 25px rgba(255,255,255,.15),
        inset 0 0 20px rgba(255,255,255,.05);
}

/* STATUS */
.status{
    position:absolute;
    bottom:105px;
    width:100%;

    text-align:center;

    color:#555;
    font-size:8px;
    letter-spacing:4px;

    z-index:6;
}

/* DRIVING EFFECT */
.driving .car{
    animation:carShake .08s infinite alternate;
}

@keyframes carShake{
    from{
        transform:translateX(-2px) scale(1.01);
    }

    to{
        transform:translateX(2px) scale(1.015);
    }
}

/* HIGH RPM */
.high-rpm .rpm{
    box-shadow:
        0 0 0 8px #101010,
        0 0 45px rgba(255,255,255,.25);
}

/* MOBILE */
@media(max-width:400px){

    .logo{
        font-size:25px;
        letter-spacing:6px;
    }

    .car-area{
        top:110px;
        height:280px;
    }

    .car{
        width:95%;
    }

    .rpm{
        width:150px;
        height:150px;
    }

    .rpm::before{
        width:124px;
        height:124px;
    }

    .rpm-number{
        font-size:32px;
    }

    .dashboard{
        bottom:125px;
    }

    .accelerator{
        width:235px;
        height:60px;
    }
}
</style>
</head>

<body>

<div class="drive" id="drive">

    <div class="logo">THE DRIVE</div>

    <div class="subtitle">
        PURE PERFORMANCE
    </div>

    <!-- SPEED EFFECT -->
    <div class="speed-line line1"></div>
    <div class="speed-line line2"></div>
    <div class="speed-line line3"></div>
    <div class="speed-line line4"></div>

    <!-- CAR -->
    <div class="car-area">

        <!-- IMPORTANT:
             Put car.jpg in the SAME folder as this HTML file -->
        <img
            src="./car.jpg"
            class="car"
            id="car"
            alt="BMW"
            draggable="false"
        >

    </div>

    <!-- RPM -->
    <div class="dashboard">

        <div class="rpm" id="rpmCircle">

            <div class="red-zone"></div>

            <div class="rpm-content">

                <div
                    class="rpm-number"
                    id="rpmNumber">
                    1000
                </div>

                <div class="rpm-text">
                    RPM
                </div>

            </div>

        </div>

    </div>

    <div
        class="status"
        id="status">
        READY TO DRIVE
    </div>

    <!-- ACCELERATOR -->
    <div class="controls">

        <button
            class="accelerator"
            id="accelerator">
            ACCELERATE
        </button>

    </div>

</div>

<!-- ENGINE SOUND -->
<audio
    id="engineSound"
    src="./engine.mp3"
    preload="auto">
</audio>


<script>

const drive =
    document.getElementById("drive");

const accelerator =
    document.getElementById("accelerator");

const rpmNumber =
    document.getElementById("rpmNumber");

const rpmCircle =
    document.getElementById("rpmCircle");

const statusText =
    document.getElementById("status");

const engineSound =
    document.getElementById("engineSound");

let rpm = 1000;
let accelerating = false;
let animationFrame;
let fallTimer;

/* MAX RPM */
const MIN_RPM = 1000;
const MAX_RPM = 8000;


/* =========================
   RPM DISPLAY
========================= */

function updateRPM(){

    const percentage =
        (rpm - MIN_RPM) /
        (MAX_RPM - MIN_RPM);

    const degrees =
        percentage * 360;

    rpmCircle.style.setProperty(
        "--rpm",
        degrees + "deg"
    );

    rpmNumber.textContent =
        Math.round(rpm);

    if(rpm >= 6500){

        drive.classList.add("high-rpm");

    }else{

        drive.classList.remove("high-rpm");

    }
}


/* =========================
   ACCELERATION
========================= */

function accelerate(){

    if(!accelerating) return;

    rpm += 120;

    if(rpm > MAX_RPM){

        rpm = MAX_RPM;

    }

    updateRPM();

    animationFrame =
        requestAnimationFrame(accelerate);
}


/* =========================
   START
========================= */

function startAcceleration(e){

    if(e){
        e.preventDefault();
    }

    if(accelerating){
        return;
    }

    clearInterval(fallTimer);

    accelerating = true;

    accelerator.classList.add("active");

    drive.classList.add("driving");

    statusText.textContent =
        "ACCELERATING";


    /* SOUND */

    try{

        engineSound.loop = true;

        engineSound.volume = 0.9;

        engineSound.currentTime = 0;

        const playPromise =
            engineSound.play();

        if(playPromise !== undefined){

            playPromise.catch(function(){

                /* Browser blocked autoplay.
                   User interaction will normally
                   allow playback. */

            });

        }

    }catch(err){}


    accelerate();
}


/* =========================
   STOP
========================= */

function stopAcceleration(e){

    if(e){
        e.preventDefault();
    }

    accelerating = false;

    cancelAnimationFrame(
        animationFrame
    );

    accelerator.classList.remove(
        "active"
    );

    drive.classList.remove(
        "driving"
    );

    statusText.textContent =
        "READY TO DRIVE";


    /* RPM FALL */

    clearInterval(fallTimer);

    fallTimer = setInterval(function(){

        if(accelerating){

            clearInterval(fallTimer);
            return;

        }

        rpm -= 180;

        if(rpm <= MIN_RPM){

            rpm = MIN_RPM;

            clearInterval(fallTimer);

        }

        updateRPM();

    },30);


    /* STOP SOUND */

    try{

        engineSound.pause();

        engineSound.currentTime = 0;

    }catch(err){}

}


/* =========================
   MOUSE
========================= */

accelerator.addEventListener(
    "mousedown",
    startAcceleration
);

accelerator.addEventListener(
    "mouseup",
    stopAcceleration
);

accelerator.addEventListener(
    "mouseleave",
    stopAcceleration
);


/* =========================
   MOBILE TOUCH
========================= */

accelerator.addEventListener(
    "touchstart",
    startAcceleration,
    {passive:false}
);

accelerator.addEventListener(
    "touchend",
    stopAcceleration,
    {passive:false}
);

accelerator.addEventListener(
    "touchcancel",
    stopAcceleration,
    {passive:false}
);


/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.code === "Space" &&
            !e.repeat
        ){

            startAcceleration(e);

        }

    }
);

document.addEventListener(
    "keyup",
    function(e){

        if(e.code === "Space"){

            stopAcceleration(e);

        }

    }
);


/* =========================
   IMAGE ERROR CHECK
========================= */

const carImage =
    document.getElementById("car");

carImage.addEventListener(
    "error",
    function(){

        statusText.textContent =
            "CAR IMAGE NOT FOUND";

        console.error(
            "car.png not found. Put car.jpg in the same folder as this HTML file."
        );

    }
);

carImage.addEventListener(
    "load",
    function(){

        console.log(
            "BMW car image loaded successfully."
        );

    }
);


/* =========================
   INITIAL
========================= */

updateRPM();

</script>

</body>
</html>
