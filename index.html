<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE DRIVE</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #030405;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ================= NAVBAR ================= */

        nav {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            padding: 0 6%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(0, 0, 0, 0.75);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(0, 120, 255, 0.2);

            z-index: 1000;

            transition: 0.4s;
        }

        /* Logo */

        .logo {
            color: white;
            text-decoration: none;

            font-size: 25px;
            font-weight: 900;

            letter-spacing: 4px;
        }

        .logo span {
            color: #087cff;
        }

        /* Menu */

        .nav-links {
            display: flex;
            gap: 30px;

            list-style: none;
        }

        .nav-links a {
            position: relative;

            color: #aaa;
            text-decoration: none;

            font-size: 11px;
            letter-spacing: 2px;

            padding: 10px 0;

            transition: 0.3s;
        }

        /* Blue underline */

        .nav-links a::after {

            content: "";

            position: absolute;

            left: 50%;
            bottom: 0;

            width: 0;
            height: 2px;

            background: #087cff;

            box-shadow: 0 0 12px #087cff;

            transform: translateX(-50%);

            transition: 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Button */

        .nav-button {

            color: white;
            text-decoration: none;

            border: 1px solid #087cff;

            padding: 12px 18px;

            font-size: 10px;
            letter-spacing: 1px;

            transition: 0.3s;
        }

        .nav-button:hover {

            background: #087cff;

            box-shadow:
                0 0 20px rgba(8, 124, 255, 0.5);
        }

        /* ================= HERO ================= */

        .hero {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 100px 20px;

            background:

                radial-gradient(
                    circle at center,
                    rgba(0, 100, 255, 0.2),
                    transparent 35%
                ),

                #030405;
        }

        .hero-content {
            max-width: 900px;
        }

        .hero-small {

            color: #087cff;

            font-size: 12px;

            letter-spacing: 6px;

            margin-bottom: 20px;
        }

        .hero h1 {

            font-size: clamp(45px, 8vw, 95px);

            line-height: 0.95;

            font-weight: 900;

            letter-spacing: -4px;
        }

        .hero h1 span {
            color: #087cff;

            text-shadow:
                0 0 30px rgba(8, 124, 255, 0.5);
        }

        .hero p {

            color: #888;

            max-width: 550px;

            margin: 30px auto;

            line-height: 1.8;

            font-size: 14px;
        }

        .hero-button {

            display: inline-block;

            padding: 16px 28px;

            background: #087cff;

            color: white;

            text-decoration: none;

            font-size: 11px;

            letter-spacing: 2px;

            transition: 0.3s;
        }

        .hero-button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 0 30px rgba(8, 124, 255, 0.5);
        }


        /* ================= MOBILE ================= */

        .menu-toggle {
            display: none;

            width: 45px;
            height: 45px;

            background: transparent;

            border: 1px solid #087cff;

            cursor: pointer;
        }

        .menu-toggle span {

            display: block;

            width: 20px;
            height: 2px;

            background: white;

            margin: 5px auto;

            transition: 0.3s;
        }


        @media (max-width: 850px) {

            .nav-links {

                position: fixed;

                top: 75px;
                right: 0;

                width: 100%;
                height: calc(100vh - 75px);

                background: rgba(2, 4, 7, 0.98);

                backdrop-filter: blur(20px);

                display: flex;

                flex-direction: column;

                justify-content: center;

                align-items: center;

                gap: 30px;

                transform: translateX(100%);

                transition: 0.5s ease;
            }

            .nav-links.open {
                transform: translateX(0);
            }

            .nav-links a {

                font-size: 24px;

                font-weight: bold;

                opacity: 0;

                transform: translateX(40px);

                transition: 0.4s;
            }

            .nav-links.open a {

                opacity: 1;

                transform: translateX(0);
            }

            .menu-toggle {
                display: block;
            }

            .nav-button {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <a href="#home" class="logo">
            THE<span>DRIVE</span>
        </a>


        <div class="nav-links" id="navLinks">

            <a href="#home">HOME</a>

            <a href="#models">MODELS</a>

            <a href="#performance">PERFORMANCE</a>

            <a href="#technology">TECHNOLOGY</a>

            <a href="#experience">EXPERIENCE</a>

            <a href="#contact">CONTACT</a>

        </div>


        <a href="#experience" class="nav-button">
            BOOK EXPERIENCE
        </a>


        <button class="menu-toggle" id="menuToggle">

            <span></span>
            <span></span>
            <span></span>

        </button>

    </nav>



    <!-- ================= HERO ================= -->

    <section class="hero" id="home">

        <div class="hero-content">

            <div class="hero-small">
                M PERFORMANCE
            </div>


            <h1>

                NOT JUST A CAR.
                <br>

                A <span>STATEMENT.</span>

            </h1>


            <p>

                Power. Prestige. Perfection.
                A driving experience engineered around
                precision, performance and emotion.

            </p>


            <a href="#models" class="hero-button">

                EXPERIENCE THE DRIVE →

            </a>

        </div>

    </section>



    <!-- ================= TEMPORARY SECTIONS ================= -->

    <section id="models" style="height:500px;"></section>

    <section id="performance" style="height:500px;"></section>

    <section id="technology" style="height:500px;"></section>

    <section id="experience" style="height:500px;"></section>

    <section id="contact" style="height:500px;"></section>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const menuToggle =
            document.getElementById("menuToggle");

        const navLinks =
            document.getElementById("navLinks");


        /* Open / Close */

        menuToggle.addEventListener("click", function () {

            navLinks.classList.toggle("open");

            menuToggle.classList.toggle("open");

        });


        /* Close after clicking */

        document.querySelectorAll(".nav-links a")
            .forEach(function (link) {

                link.addEventListener("click", function () {

                    navLinks.classList.remove("open");

                    menuToggle.classList.remove("open");

                });

            });


        /* ESC closes menu */

        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {

                navLinks.classList.remove("open");

                menuToggle.classList.remove("open");

            }

        });

    </script>


</body>

</html>
