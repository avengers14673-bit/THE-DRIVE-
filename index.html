<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>THE DRIVE — BMW</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#050505;
    color:white;
    overflow:hidden;
}

/* ================= NAVBAR ================= */

.navbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:75px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 7%;

    z-index:1000;

    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);

    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:4px;
}

/* ================= MENU BUTTON ================= */

.menu-btn{
    width:45px;
    height:45px;

    border:1px solid rgba(255,255,255,.3);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.3s;
}

.menu-btn:hover{
    transform:rotate(90deg);
    background:white;
    color:black;
}

.menu-btn span{
    font-size:22px;
}

/* ================= MENU ================= */

.menu{
    position:fixed;
    top:0;
    right:-100%;

    width:100%;
    max-width:450px;
    height:100vh;

    background:#090909;

    z-index:999;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.5s ease;
}

.menu.active{
    right:0;
}

.menu ul{
    list-style:none;
    text-align:center;
}

.menu li{
    margin:25px 0;
}

.menu a{
    color:white;
    text-decoration:none;

    font-size:34px;
    font-weight:800;
    letter-spacing:4px;

    transition:.3s;
}

.menu a:hover{
    letter-spacing:9px;
}

/* ================= HERO ================= */

.hero{
    min-height:100vh;

    padding:110px 5% 30px;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    position:relative;
}

/* ================= TITLE ================= */

.small-title{
    font-size:12px;
    letter-spacing:6px;
    color:#888;

    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(50px,9vw,110px);

    line-height:.85;

    font-weight:900;

    letter-spacing:-5px;
}

.hero h1 span{
    display:block;
}

.hero-text{
    margin:25px auto;

    color:#888;

    font-size:14px;
    letter-spacing:2px;
}

/* ================= CAR ================= */

.car-section{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

    margin-top:5px;
}

.car-image{
    display:block;

    width:78%;
    max-width:700px;

    height:auto;

    margin:0 auto;

    object-fit:contain;

    filter:drop-shadow(
        0 25px 35px rgba(0,0,0,.9)
    );

    transition:.1s;
}

/* ================= ACCELERATION ================= */

body.accelerating .car-image{

    animation:carShake .07s infinite alternate;

    filter:
        drop-shadow(0 0 30px rgba(255,255,255,.25))
        drop-shadow(0 25px 35px rgba(0,0,0,.9));
}

@keyframes carShake{

    from{
        transform:translateX(-2px) scale(1.015);
    }

    to{
        transform:translateX(2px) scale(1.035);
    }
}

/* ================= RPM ================= */

.rpm-box{
    width:270px;

    margin-top:2px;
}

.rpm-top{
    display:flex;
    justify-content:space-between;

    font-size:9px;

    letter-spacing:3px;

    color:#666;

    margin-bottom:7px;
}

.rpm-bar{
    width:100%;
    height:6px;

    background:#181818;

    border-radius:20px;

    overflow:hidden;
}

.rpm-fill{
    width:8%;
    height:100%;

    background:white;

    border-radius:20px;

    transition:width .1s linear;
}

.rpm-number{
    margin-top:6px;

    font-size:10px;

    letter-spacing:3px;

    color:#777;
}

/* ================= ACCELERATOR ================= */

.accelerator-area{

    margin-top:12px;

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:7px;
}

.accelerator-label{

    font-size:9px;

    letter-spacing:4px;

    color:#666;
}

.accelerator{

    width:135px;
    height:55px;

    border:1px solid #444;

    border-radius:13px;

    background:
        linear-gradient(
            #1b1b1b,
            #070707
        );

    color:white;

    font-size:10px;

    font-weight:bold;

    letter-spacing:3px;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    touch-action:none;

    transition:.1s;

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,.08),
        0 10px 25px rgba(0,0,0,.7);
}

.accelerator:hover{
    border-color:#888;
}

.accelerator.pressed{

    transform:
        translateY(6px)
        scale(.96);

    background:#252525;

    box-shadow:
        inset 0 5px 10px rgba(0,0,0,.8),
        0 3px 8px rgba(0,0,0,.5);
}

/* ================= SPEED GLOW ================= */

.speed-glow{

    position:absolute;

    width:500px;
    height:300px;

    border-radius:50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,.08),
            transparent 70%
        );

    pointer-events:none;

    opacity:0;

    transition:.2s;
}

body.accelerating .speed-glow{
    opacity:1;

    animation:glowPulse .25s infinite alternate;
}

@keyframes glowPulse{

    from{
        transform:scale(.95);
    }

    to{
        transform:scale(1.1);
    }
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .navbar{
        padding:0 5%;
    }

    .logo{
        font-size:20px;
    }

    .hero{
        padding-top:100px;
    }

    .hero h1{
        letter-spacing:-3px;
    }

    .hero-text{
        margin:18px auto;
        font-size:11px;
    }

    .car-image{
        width:94%;
    }

    .rpm-box{
        width:230px;
    }

    .accelerator{
        width:125px;
        height:52px;
    }

    .menu a{
        font-size:30px;
    }
}
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        THE DRIVE
    </div>

    <div
        class="menu-btn"
        onclick="toggleMenu()"
    >
        <span>☰</span>
    </div>

</nav>


<!-- ================= MENU ================= -->

<div
    class="menu"
    id="menu"
>

    <ul>

        <li>
            <a href="#" onclick="toggleMenu()">
                BMW
            </a>
        </li>

        <li>
            <a href="#" onclick="toggleMenu()">
                DRIVE
            </a>
        </li>

    </ul>

</div>


<!-- ================= MAIN ================= -->

<section class="hero">

    <div class="small-title">
        THE ULTIMATE DRIVING EXPERIENCE
    </div>


    <h1>
        THE
        <span>DRIVE</span>
    </h1>


    <p class="hero-text">
        FEEL THE POWER • EXPERIENCE THE DRIVE
    </p>


    <!-- GLOW -->

    <div class="speed-glow"></div>


    <!-- CENTER BMW -->

    <div class="car-section">

        <img
            src="car.jpg"
            alt="BMW"
            class="car-image"
            id="car"
        >

    </div>


    <!-- RPM -->

    <div class="rpm-box">

        <div class="rpm-top">

            <span>RPM</span>

            <span>REDLINE</span>

        </div>


        <div class="rpm-bar">

            <div
                class="rpm-fill"
                id="rpmFill"
            ></div>

        </div>


        <div
            class="rpm-number"
            id="rpmNumber"
        >
            0800 RPM
        </div>

    </div>


    <!-- ACCELERATOR -->

    <div class="accelerator-area">

        <div class="accelerator-label">
            PRESS & HOLD
        </div>


        <button
            class="accelerator"
            id="accelerator"
        >
            ACCELERATE
        </button>

    </div>

</section>


<!-- ================= SOUND ================= -->

<audio
    id="engineSound"
    src="engine.mp3"
    preload="auto"
    loop>
</audio>


<script>

/* ================= MENU ================= */

function toggleMenu(){

    const menu =
        document.getElementById("menu");

    menu.classList.toggle("active");

}


/* ================= ACCELERATOR ================= */

const accelerator =
    document.getElementById("accelerator");

const engineSound =
    document.getElementById("engineSound");

const rpmFill =
    document.getElementById("rpmFill");

const rpmNumber =
    document.getElementById("rpmNumber");


let accelerating = false;

let rpm = 800;

let animationFrame;


/* ================= START ================= */

function startAcceleration(){

    if(accelerating){
        return;
    }

    accelerating = true;


    accelerator.classList.add("pressed");

    document.body.classList.add("accelerating");


    /*
       Start sound after user interaction.
    */

    engineSound.currentTime = 0;

    engineSound.volume = 1;

    engineSound.play().catch(() => {

        console.log(
            "Tap the accelerator to start sound."
        );

    });


    animateRPM();
}


/* ================= STOP ================= */

function stopAcceleration(){

    if(!accelerating){
        return;
    }

    accelerating = false;


    accelerator.classList.remove("pressed");

    document.body.classList.remove("accelerating");


    cancelAnimationFrame(
        animationFrame
    );


    /*
       RPM falls smoothly.
    */

    const cooldown =
        setInterval(() => {

            rpm -= 180;


            if(rpm <= 800){

                rpm = 800;

                clearInterval(cooldown);

                engineSound.pause();

                engineSound.currentTime = 0;

            }


            updateRPM();

        },50);

}


/* ================= RPM ================= */

function animateRPM(){

    if(!accelerating){
        return;
    }


    rpm += 170;


    if(rpm >= 7000){
        rpm = 7000;
    }


    updateRPM();


    /*
       Engine pitch increases with RPM.
    */

    engineSound.playbackRate =
        0.75 +
        (rpm / 7000) * 0.7;


    animationFrame =
        requestAnimationFrame(
            animateRPM
        );

}


/* ================= UPDATE RPM ================= */

function updateRPM(){

    const percentage =
        ((rpm - 800) / (7000 - 800))
        * 100;


    rpmFill.style.width =
        Math.max(8,percentage)
        + "%";


    rpmNumber.textContent =
        Math.round(rpm)
        .toString()
        .padStart(4,"0")
        + " RPM";

}


/* ================= MOUSE ================= */

accelerator.addEventListener(
    "mousedown",
    startAcceleration
);


accelerator.addEventListener(
    "mouseup",
    stopAcceleration
);


accelerator.addEventListener(
    "mouseleave",
    stopAcceleration
);


/* ================= TOUCH ================= */

accelerator.addEventListener(
    "touchstart",
    function(event){

        event.preventDefault();

        startAcceleration();

    },
    {passive:false}
);


accelerator.addEventListener(
    "touchend",
    function(event){

        event.preventDefault();

        stopAcceleration();

    },
    {passive:false}
);


/* ================= INITIAL ================= */

updateRPM();

</script>

</body>
</html>
